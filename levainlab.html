<!doctype html>
<!-- Levain Lab — 상태·시간·저장 하네스 (dev 전용, vite dev로 서빙. 앱 번들과 무관 —
     motionlab·breadlab과 같은 축, 확장기획 §6). 실제 앱(startApp)을 lab 저장소
     (levain:lab-save)와 FakeClock으로 부팅한다 — 프로덕션 저장은 절대 건드리지 않는다.
     사용법은 scripts/levainlab.ts 머리 주석 -->
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>levainlab</title>
  <style>
    /* 랩 패널 — 앱 위 플로팅. 앱 자체 스타일은 main.css(스크립트에서 import) */
    #lab-toggle {
      position: fixed; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px));
      z-index: 100; width: 42px; height: 42px; border: 0; border-radius: 50%;
      background: #4a3220; color: #f4ead4; font-size: 18px; cursor: pointer;
      box-shadow: 0 2px 8px rgba(74,50,32,0.4);
    }
    #lab-panel {
      position: fixed; right: 8px; top: calc(58px + env(safe-area-inset-top, 0px));
      z-index: 100; width: min(92vw, 360px); max-height: 74vh; overflow-y: auto;
      background: #fffdf7; border: 1px solid #dccab0; border-radius: 14px;
      padding: 12px; font: 13px/1.5 system-ui, sans-serif; color: #4a3220;
      box-shadow: 0 6px 20px rgba(74,50,32,0.25);
    }
    #lab-panel.hidden { display: none; }
    #lab-panel h3 { margin: 10px 0 6px; font-size: 12px; color: #8a6a4a; }
    #lab-panel h3:first-child { margin-top: 0; }
    .lab-row { display: flex; flex-wrap: wrap; gap: 5px; }
    .lab-row button, .lab-row label {
      border: 1px solid #dccab0; border-radius: 999px; background: #f2e6d3;
      padding: 5px 10px; font: 12px/1 system-ui; color: #4a3220; cursor: pointer;
    }
    .lab-row label { display: inline-flex; align-items: center; gap: 4px; }
    .lab-row button.primary { background: #c4784a; color: #fff8ef; border-color: #c4784a; }
    .lab-row button.danger { background: transparent; color: #8a6a4a; }
    .lab-dump {
      font-family: ui-monospace, monospace; font-size: 11px; white-space: pre-wrap;
      background: #f2e6d3; border-radius: 8px; padding: 8px; margin-top: 6px;
    }
    #lab-migrate { width: 100%; box-sizing: border-box; height: 64px; font-size: 11px;
      font-family: ui-monospace, monospace; border: 1px solid #dccab0; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>
  </div>
  <div id="ui-root"></div>
  <button id="lab-toggle" aria-label="Levain Lab">🧪</button>
  <div id="lab-panel" class="hidden"></div>
  <script type="module" src="/scripts/levainlab.ts"></script>
</body>
</html>
